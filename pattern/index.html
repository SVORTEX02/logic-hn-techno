<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .form-container {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
        backdrop-filter: blur(10px);
      }

      h2 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
        font-size: 28px;
        font-weight: 600;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 500;
        font-size: 14px;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e1e5e9;
        border-radius: 10px;
        font-size: 16px;
        transition: all 0.3s ease;
        background: #f8f9fa;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        transform: translateY(-2px);
      }

      input:hover,
      select:hover,
      textarea:hover {
        border-color: #667eea;
      }

      .gender-group {
        display: flex;
        gap: 20px;
        margin-top: 8px;
      }

      .radio-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      input[type="radio"] {
        width: auto;
        margin: 0;
      }

      input[type="range"] {
        background: linear-gradient(to right, #667eea, #764ba2);
      }

      input[type="color"] {
        height: 50px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }

      .submit-btn {
        width: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 20px;
      }

      .submit-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
      }

      .submit-btn:active {
        transform: translateY(-1px);
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
      }

      input[type="checkbox"] {
        width: auto;
        margin: 0;
      }

      @media (max-width: 600px) {
        .form-container {
          padding: 30px 20px;
        }

        .gender-group {
          flex-direction: column;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h2>Contact Information</h2>
      <form id="contactForm">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Enter your full name"
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Enter your email"
          />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            required
            placeholder="Enter your phone number"
          />
        </div>

        <div class="form-group">
          <label for="birthdate">Birth Date *</label>
          <input type="date" id="birthdate" name="birthdate" required />
        </div>

        <div class="form-group">
          <label>Gender *</label>
          <div class="gender-group">
            <div class="radio-item">
              <input
                type="radio"
                id="male"
                name="gender"
                value="male"
                required
              />
              <label for="male">Male</label>
            </div>
            <div class="radio-item">
              <input
                type="radio"
                id="female"
                name="gender"
                value="female"
                required
              />
              <label for="female">Female</label>
            </div>
            <div class="radio-item">
              <input
                type="radio"
                id="other"
                name="gender"
                value="other"
                required
              />
              <label for="other">Other</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="website">Website/Portfolio</label>
          <input
            type="url"
            id="website"
            name="website"
            placeholder="https://example.com"
          />
        </div>

        <div class="form-group">
          <label for="age">Age Range</label>
          <input
            type="range"
            id="age"
            name="age"
            min="18"
            max="100"
            value="25"
          />
          <small>Age: <span id="ageValue">25</span></small>
        </div>

        <div class="form-group">
          <label for="password">Create Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter a secure password"
          />
        </div>

        <div class="form-group">
          <label for="favoriteColor">Favorite Color</label>
          <input
            type="color"
            id="favoriteColor"
            name="favoriteColor"
            value="#667eea"
          />
        </div>

        <div class="form-group">
          <label for="resume">Upload Resume (PDF/DOC)</label>
          <input
            type="file"
            id="resume"
            name="resume"
            accept=".pdf,.doc,.docx"
          />
        </div>

        <div class="form-group">
          <label for="availability">Preferred Meeting Time</label>
          <input type="datetime-local" id="availability" name="availability" />
        </div>

        <div class="form-group">
          <label for="comments">Additional Comments</label>
          <textarea
            id="comments"
            name="comments"
            rows="4"
            placeholder="Any additional information you'd like to share..."
          ></textarea>
        </div>

        <div class="form-group">
          <div class="checkbox-group">
            <input
              type="checkbox"
              id="newsletter"
              name="newsletter"
              value="yes"
            />
            <label for="newsletter">Subscribe to our newsletter</label>
          </div>
        </div>

        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="terms" name="terms" required />
            <label for="terms">I agree to the Terms and Conditions *</label>
          </div>
        </div>

        <button type="submit" class="submit-btn">Submit Form</button>
      </form>
    </div>
  </body>
</html>
