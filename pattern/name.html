<script>
  for (let i = 1; i <= 7; i++) {
    for (let j = 1; j <= 32; j++) {
      if (
        ((i == 1 || i == 7 || i == 4) && (j <= 5 || (j >= 20 && j <= 23))) ||
        (i >= 2 && i <= 3 && j == 1) ||
        (i >= 5 && i <= 6 && j == 5) ||
        j == 7 ||
        j == 11 ||
        (j >= 7 && j <= 11 && i == 4) ||
        j == 13 ||
        ((i == 1 || i == 4) && j >= 13 && j <= 17) ||
        (j == 17 && i <= 4) ||
        (j - i == 11 && i >= 4) ||
        j == 20 ||
        (j == 29 && i >= 4) ||
        ((j - i == 25 || i + j == 33) && i <= 4)
      ) {
        document.write("* ");
      } else {
        document.write("&nbsp;&nbsp;&nbsp;");
      }
    }
    document.write("</br>");
  }
</script>
