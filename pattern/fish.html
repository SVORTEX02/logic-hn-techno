<script>
  n = 10;
  for (let i = 1; i <= 10; i++) {
    for (let j = 1, k = 1; j <= 60; j++, k++) {
      if (
        i + j <= 6 ||
        i - j >= 5 ||
        (j - i >= 37 && i + j <= 45) ||
        (i + j >= 47 && j - i <= 35)
      ) {
        document.write("&nbsp;&nbsp;&nbsp;");
      } else {
        document.write("*");
      }
    }
    document.write("</br>");
  }
</script>
