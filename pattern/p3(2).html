<script>

/*
# 12345
# 67898
# 76543
# 21234
# 56789
*/

for(var i = 1,x = 1,c = true;i<=25;i++)
{
    document.write(x)
    if(x == 9)
    {
        c= false;
    }
    if(x == 1)
    {
        c = true;
    }
    if(c)
    {
        x++;
    }
    else{
        x--;
    }
    if(i % 5 == 0)
    {
        document.write('<br/>')
    }
}

</script>
