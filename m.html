<!DOCTYPE html>
<html>
  <head>
    <title>Pattern</title>
  </head>
  <body>
    <script>
      for (let i = 0; i < 5; i++) {
        for (let j = 0; j < 9; j++) {
          if (i + j < 4 || j - i > 4) {
            document.write("*");
          } else {
            document.write("&nbsp;&nbsp;");
          }
        }
        document.write("<br>");
      }

      for (let i = 0; i < 5; i++) {
        for (let j = 0; j < 9; j++) {
          if (j - i < 0 || i + j > 8) {
            document.write("*");
          } else {
            document.write("&nbsp;&nbsp");
          }
        }
        document.write("<br>");
      }
    </script>
  </body>
</html>
